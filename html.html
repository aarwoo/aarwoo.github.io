<head>
<meta name="viewport" content="width=device-width height=device-height initial-scale=1.0
                               minimum-scale=1.0 maximum-scale=1.0 user-scalable=no"/>
<title>HTML:Try youself</title>
<script>
function f(src,html){
    html.srcdoc=src.value;
    let V = src.style.visibility;
    src.style.visibility = html.style.visibility;
    html.style.visibility = V;
}
</script>
<style>
  #src,#html{
    position:fixed;
    overflow:auto;
    top:0;
    left:0;
    width:100dvw;
    height:100dvh;
  }
  #src{
    font-size:1.5rem;
    font-family: monospace;
  }
  #src{
    visibility: visible;
  }
  #html{
    visibility: hidden;
  }
  #switch{
    position:fixed;
    right:1dvw;
    bottom:1dvh;
    font-size:3.0rem;
    background-color: forestgreen;
    opacity: 0.666;
    z-index: 1;
  }
  
</style>
</head>
<body>
<div 
  id = "switch" 
  onclick = "f(
      document.getElementById('src'),
      document.getElementById('html')
  )">🔁</div>
<textarea id="src" 
          style="visibility:visible"
          wrap="off" 
          autofocus></textarea>
<iframe id="html" 
        style="visibility:hidden"></iframe>
</body>
