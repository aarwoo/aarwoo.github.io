<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width height=device-height initial-scale=1.0
                               minimum-scale=1.0 maximum-scale=1.0 user-scalable=no"/>
</head>
<script>
    class game{

        static #player = true;
        
        static #scope = new Map();

        static #peer_selected = new Set();

        static #id(isplayer){
            return (
                (isplayer === true) 
                ?  (game.#player) 
                :  (!game.#player)
            );
        }

        static #switch(_ = null){
            game.#player = !game.#player;
            let card = document.getElementsByClassName("card"); 
            for(let c of card){
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                   //pass 
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
            game.#update_scope();
        }
        
        static #steal(_ = null){
            let card = document.getElementsByClassName("card");
            let thf = (c) => (game.get_random(2) === 0)? c : ``;
            for(let c of card){
                c.dataset[game.#player] = thf(c.dataset[game.#player]);
                c.dataset[!game.#player] = thf(c.dataset[!game.#player]);
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                   //pass 
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
        }
        
        static #demand(id){
            game.#scope.set(
                id,
                game.#scope.get(id) + 40
            );
            game.#scope.set(
                !id,
                game.#scope.get(!id) - 40
            );
            game.#update_scope();
        }
        
        static #discard(id){
            game.#scope.set(
                id,
                game.#scope.get(id) - 40
            );
            game.#scope.set(
                !id,
                game.#scope.get(!id) + 40
            );
            game.#update_scope();
        }

        static #retarget(_ = null){
            let target = document.getElementById("target");
            target.textContent = String(
                game.get_random(99 * 99 + 1)
            ).padStart(4,"0");
            peer.notice_retarget(target.textContent);
        }
        static #rescope(_ = null){
            let f = () => 5 + game.get_random(90/5 + 1) * 5;
            game.#scope.set(game.#player, f());
            game.#scope.set(!game.#player, f());
            game.#update_scope();
        }

        static #add(seed,card){
            return seed + card;
        }

        static #mul(seed,card){
            return seed * card;
        }
        
        static #next_seed(){
            let seed = document.getElementsByClassName("seed");
            for(let s of seed){
                s.textContent = game.#new_seed_content();
            }
            peer.notice_next_seed(
                [...seed].map(s => s.textContent)
            );
        }
        
        static #update_scope(){
            let scope = document.getElementById("scope");
            let values = [...game.#scope.values()];
            if(values.find(e => e < 0 || e > 100) !== undefined){
                //rule violation
                dialog.notice("Rule Violation!");
                game.init();
                game.#steal();
            }else if(values.find(e => e === 100) !== undefined){
                
                if(game.#scope.get(game.#player) === game.#scope.get(!game.#player)){
                    //both draw
                    dialog.notice("-_Draw_-");
                }else if(game.#scope.get(game.#player) === 100){
                    //player win
                    dialog.notice("^_Win_^");
                }else{
                    //peer win
                    dialog.notice("T_Fail_T");
                }
                
                game.init();
            }else{
                let fscope = (t) => String(game.#scope.get(t)).padStart(2,"0");
                let player_scope = fscope(game.#player);
                let peer_scope = fscope(!game.#player);
                
                scope.textContent = `player ${player_scope} peer ${peer_scope}`;
                peer.notice_scope_update(
                    peer_scope,
                    player_scope
                );
            }
        }

        static #new_seed_content(){
            return String(game.get_random(100)).padStart(2,"0");
        }

        static #new_card_content(){
            let op = "+*";
            let random_op = op[game.get_random(op.length)];
            
            return `${random_op}${game.#new_seed_content()}`;
        }

        static #new_card(self,isplayer){
            let content = game.#new_card_content();
            let id = game.#id(isplayer);
            
            if(self.dataset[id] === ``){
                game.#scope.set(
                    id,
                    game.#scope.get(id) - 5
                );
                self.dataset[id] = content;
            }else{
                //pass
            }
            self.textContent = self.dataset[game.#player];

            game.#update_scope();

        }

        static #referee_vent(){
            let f = [
                game.#steal,
                game.#rescope,
                game.#retarget,
                game.#switch
            ];
            
            f[game.get_random(f.length)]();
        }

        static get_random(sup){
            let next = new Uint32Array(1);
            next[0] = ~0;
            next[0] = Math.floor(next[0] * Math.random());
            window.crypto?.getRandomValues(next);
            return next[0] % sup;
        }

        static init(){
            game.#scope.set(game.#player, 50);
            game.#scope.set(!game.#player, 50);
            game.#update_scope();
            
            game.#next_seed();
            
            let card = document.getElementsByClassName("card");
            for(let c of card){
                c.dataset[game.#player] = game.#new_card_content();
                c.dataset[!game.#player] = game.#new_card_content();
                c.textContent = c.dataset[game.#player];
                c.className = `card`;
                game.#peer_selected.delete(c);
            }
            
            game.#retarget();

            peer.notice_init(card.length);
            
            dialog.notice(
`\
seed: the blue line,
      0 <= seed and
      seed <= 99
card: all under seed,
      click to selected (green),
      or not (gray).
      if a used card is click
      to selected, auto new card
      and (scope - 5).
      number on card text is:
      0 <= number and
      number <= 99
*card: card text content
       start with *
+card: card text content
       start with +
target: on the left of PLAY,
        0 <= target and
        target <= 99 * 99
------
PLAY: click to play a card,
      all selected cards will be
      calculated with all seed,
      in this form: (seed card),
      as results, 
      result is any one of results.
      
      if result = target :
         (scope + 20)
      else if result > 
      max(peer results):
         if card is +card:
           (scope + 10)
         else if card is *card:
           (scope - 5)
      else if result < 
      min(peer results):
         if card is +card:
            (scope - 5)
         else if card is *card:
            (scope + 10)
     
      all selected cards marked used
      by remove text content.
      NOTE: if player or peer no selected
      card, referee will be vent,
      and attack player and peer
VENT: click to vent, 
      then attack a referee.
      NOTE: peer also can do.
------
scope: 
      if anyone scope < 0 
      or scope > 100:
        Rule Violation
      else if both 100:
        Draw
      else if only your 100:
        (you) Win
      else if only peer 100:
        (peer) Win, aka (You) Fail
------
attack a referee will 
cause one of following:
   steal: random marked used card,
          for you and peer
   demand: (scope + 40) for you,
           (scope - 40) for peer,
   discard: (scope - 40) for you,
            (scope + 40) for peer
   retarget: random new target
   switch: swap player and peer
attack player and peer will
cause one of following:
   steal: random marked used card,
          for player and peer
   rescope: random scope,
            5 <= scope && scope <= 95,
            for played and peef
   retarget: random new target
   switch: swap player and peer
`
            );
        }
        
        static player_select(self){
            if(self.className === `card`){
                game.#new_card(self,true);
                self.className = `card selected`;
            }else{
                self.className = `card`;
            }

            peer.notice_take_action();
        }

        static *peer_select(){
            let card = document.getElementsByClassName("card");

            for(let c of card){
                if((yield c.dataset[!game.#player]) === true){
                    game.#new_card(c,false);
                    game.#peer_selected.add(c);
                }else{
                    game.#peer_selected.delete(c);
                }
            }
        }

        static play(){
            let seed = document.getElementsByClassName("seed");
            let target = document.getElementById("target");
            let player = document.getElementsByClassName("selected");
            let peer = game.#peer_selected;

            if(player.length === 0 || peer.size() === 0){
                game.#referee_vent();
                return;
            }else{
                //pass
            }

            let error = () => {
                dialog.notice("Data Tampering!!!");
                location.reload();
            };
            let int = (s, sup) => {
                let n = Number.parseInt(s,10);
                if(Number.isNaN(n) === true || n < 0 || n >= sup){
                    error();
                }else{
                    return n;
                }
            };
            let trans = (t) => {
                let r = new Map();
                if( t[0] === "+"){
                    r.set("f",game.#add);
                } else if ( t[0] === "*" ){
                    r.set("f",game.#mul);
                } else{
                    error();
                }
                r.set(
                    "card", 
                    int(t.slice(1),100)
                );
                return r;
            };
            
            seed = [...seed].map(
                s => int(s.textContent,100)
            );
            target = int(target.textContent,99 * 99 + 1);
            
            player = [...player].map(
                p => {
                    let t = p.dataset[game.#player];
                    p.dataset[game.#player] = "";
                    p.textContent = p.dataset[game.#player];
                    p.className = `card`;
                    return trans(t);
                }
            );
            peer = [...peer].map(
                p => {
                    let t = p.dataset[!game.#player];
                    p.dataset[!game.#player] = "";
                    game.#peer_selected.delete(p);
                    return trans(t);
                }
            );
            
            let calculate = (cards) => cards.flatMap(
                c => seed.map(
                    s => {
                        let r = new Map();
                        
                        r.set(
                            "f",
                            c.get("f")
                        );
                        
                        r.set(
                            "val",
                            c.get("f")(
                                s,
                                c.get("card")
                            )
                        );
                        
                        return r;
                    }
                )
            );
            let result = (calculated) => calculated.map(
                c => c.get("val")
            );

            player = calculate(player);
            let player_min = Math.min(...result(player));
            let player_max = Math.max(...result(player));
            
            peer = calculate(peer);
            let peer_min = Math.min(...result(peer));
            let peer_max = Math.max(...result(peer));

            let fscope = (calculated,id,min,max) => {
                for(let c of calculated){
                    let val = c.get("val");
                    let f = c.get("f");
                    if( val === target ){
                        game.#scope.set(
                            id,
                            game.#scope.get(id) + 20
                        );
                    }else if( val > max ){
                        if(f === game.#add){
                            game.#scope.set(
                                id,
                                game.#scope.get(id) + 10
                            );
                        }else{
                            game.#scope.set(
                                id,
                                game.#scope.get(id) - 5
                            );
                        }
                    }else if ( val < min ){
                        if(f === game.#mul){
                            game.#scope.set(
                                id,
                                game.#scope.get(id) + 10
                            );
                        }else{
                            game.#scope.set(
                                id,
                                game.#scope.get(id) - 5
                            );
                        }
                    }else{
                        //pass
                    }
                }
            };

            fscope(
                player,
                game.#player,
                peer_min,
                peer_max
            );

            fscope(
                peer,
                !game.#player,
                player_min,
                player_max
            );

            game.#update_scope();
        }

        static vent(isplayer){
            let f = [
                game.#steal,
                game.#demand,
                game.#discard,
                game.#retarget,
                game.#switch
            ];
            
            f[game.get_random(f.length)](
                game.#id(isplayer)
            );
            
            peer.notice_take_action();
        }
        
    }

    //a simple peer
    class peer{
        static #seeds;
        static #target;
        static #my_scope;
        static #it_scope;
        static #empty_counts;
        static #card_counts;
        
        static notice_init(card_counts){
            peer.#empty_counts = 0;
            peer.#card_counts = card_counts;
        }
        
        static notice_next_seed(seeds){
            peer.#seeds = seeds.map(
                s => Number.parseInt(s,10)
            );
        }
        
        static notice_retarget(target){
            peer.#target = Number.parseInt(
                target,
                10
            );
        }

        static notice_scope_update(peer_scope,player_scope){
            peer.#my_scope = Number.parseInt(
                peer_scope,
                10
            );
            peer.#it_scope = Number.parseInt(
                player_scope,
                10
            );
        }

        static notice_take_action(){
            if(
                peer.#deside(
                    [peer.#my_scope,peer.#it_scope].every(
                        s => s >= 40 && s < 60
                    ),
                    Math.max(
                        0,
                        peer.#it_scope - peer.#my_scope
                    ),
                    60 - 40
                ) === true
            ){
                game.vent(false);
            }else{
                let cards = game.peer_select();
                let select_it = false;
                let empty_counts = 0;
                for(
                    let card = cards.next();
                    card.done === false;
                    card = cards.next(select_it)
                ){
                    if(card.value === ``){
                        select_it = peer.#deside(
                            peer.#empty_counts > 0
                         && peer.#my_scope >= 5,
                            peer.#empty_counts,
                            peer.#card_counts + 1
                        );
                        empty_counts = empty_counts + (
                            (select_it === true)? 0 : 1
                        );
                    }else if(card.value[0] === "+"){
                        select_it = peer.#add_card(
                            Number.parseInt(
                                card.value.slice(1),
                                10
                            )
                        );
                    }else if(card.value[0] === "*"){
                        select_it = peer.#mul_card(
                            Number.parseInt(
                                card.value.slice(1),
                                10
                            )
                        );
                    }else{
                        select_it = false;
                    }
                }
                peer.#empty_counts = empty_counts;
            }
        }


        static #deside(base,p,q){
            return base && game.get_random(q) < p;
        }

        static #add_card(card){
            let result = peer.#seeds.map( s => s + card);
            let T = 99 + 99;
            let vote = new Map();
            vote.set(true,0);
            vote.set(false,0);
            let fvote = (v) => vote.set(
                v,
                vote.get(v) + 1
            );
            
            for(let r of result){
                if(r === peer.#target){
                    return true;
                }else{
                    fvote(
                        peer.#deside(
                            true,
                            r,
                            T + 1
                        )
                    );
                }
            }

            let d = vote.get(true) - vote.get(false);

            if(d === 0){
                return peer.#deside(true,0,2);
            }else{
                return d > 0;
            }
        }

        static #mul_card(card){
            let result = peer.#seeds.map( s => s * card );
            let T = 99 * 99;
            let vote = new Map();
            vote.set(true,0);
            vote.set(false,0);
            let fvote = (v) => vote.set(
                v,
                vote.get(v) + 1
            );
            
            for(let r of result){
                if(r === peer.#target){
                    return true;
                }else{
                    fvote(
                        peer.#deside(
                            true,
                            T - r,
                            T + 1
                        )
                    );
                }
            }

            let d = vote.get(true) - vote.get(false);

            if(d === 0){
                return peer.#deside(true,0,2);
            }else{
                return d > 0;
            }
        }
        
    }
</script>
