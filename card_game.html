<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,height=device-height,
                                   initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,
                                   user-scalable=no"/>
</head>
<script>
    class game{

        static #player = true;
        
        static #scope = new Map();

        static #peer_selected = new Set();

        /*NOTE: those requires unchecked*/
        
        // min_scope % 10 === 0
        static #min_scope = 0;
        // max_scope % 10 === 0
        // && max_scope >= min_scope + 200
        static #max_scope = 32000;
        // flex_scope >= 0 && flex_scope % 10 === 0
        static #flex_scope = 8000;
        //    min_scope <= init_scope
        // && init_scope <= max_scope
        // && init_scope % 10 === 0
        static #init_scope = 16000;
        // max chars of N, where
        //    (min_scope - flex_scope) <= N
        // && N <= (max_scope + flex_scope)
        static #scope_fix = 5;

        //display duration, in ms
        static #each_event_display = 3000;
        
        static #event_promise = Promise.resolve();

        static #id(isplayer){
            return (
                (isplayer === true) 
                ?  (game.#player) 
                :  (!game.#player)
            );
        }

        static #name(id){
            return (
                (id === game.#player)
                ? "you"
                : "peer"
            );
        }

        static #event(content,peer_watch = true,player_watch = true){
            let e = document.getElementById("event");

            game.#event_promise = game.#event_promise.then(
                () => {
                    if(peer_watch === true){
                        peer.watch_event(content);
                    }else{
                        //pass
                    }
                    
                    if(player_watch === true){
                        e.textContent = content;
                        e.style.visibility = "visible";
                        return new Promise(
                            (resolve,reject) => setTimeout(
                                resolve,
                                game.#each_event_display
                            )
                        );
                    }else{
                        return;
                    }
                }
            ).then(
                () => {
                    e.style.visibility = "hidden";
                }
            );       
        }

        static #switch(_ = null){
            game.#event("uno reverse!");
            
            game.#player = !game.#player;
            let card = document.getElementsByClassName("card"); 
            for(let c of card){
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                   //pass 
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
            game.#update_scope();
        }
        
        static #steal(_ = null){
            game.#event("a master thief strikes");
            
            let card = document.getElementsByClassName("card");
            let thf = (c) => (game.get_random(2) === 0)? c : ``;
            for(let c of card){
                c.dataset[game.#player] = thf(c.dataset[game.#player]);
                c.dataset[!game.#player] = thf(c.dataset[!game.#player]);
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                   //pass 
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
        }

        static #mug(_ = null){
            game.#event("black-market turf war");
            
            let card = document.getElementsByClassName("card");
            let rdi = () => game.get_random(card.length);
            let rnd = () => game.get_random(2) === 0;
            
            let res = (c) => {
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                    //pass
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            };
            
            let fmug = (a,b) => {
                let A = card[rdi()];
                let B = card[rdi()];
                A.dataset[a] = B.dataset[b];
                B.dataset[b] = ``;
                res(A);
                res(B);
            };
            
            do {
                if( rnd() === true ){
                    fmug(
                        game.#player,
                        !game.#player
                    );
                }else{
                    fmug(
                        !game.#player,
                        game.#player
                    );
                }  
            } while (rnd() === true);
        }
        
        static #demand(id){
            game.#event(`${game.#name(id)}: nice scope you got there...`);
                
            game.#scope.set(
                id,
                game.#scope.get(id) + 200
            );
            game.#scope.set(
                !id,
                game.#scope.get(!id) - 200
            );
            game.#update_scope();
        }
        
        static #discard(id){
            game.#event(`${game.#name(id)}: generous donation`);
            
            game.#scope.set(
                id,
                game.#scope.get(id) - 200
            );
            game.#scope.set(
                !id,
                game.#scope.get(!id) + 200
            );
            game.#update_scope();
        }

        static #retarget(_ = null, notice = true){
            if(notice === true){
                game.#event("moving the goalposts");
            }else{
                //pass
            }
            
            let target = document.getElementById("target");
            target.textContent = game.#random_num_content(10,1);
            peer.notice_retarget(target.textContent);
        }
        
        static #rescope(_ = null){
            game.#event("inflation strikes");

            let f = () => (game.#min_scope + 100) + game.get_random(
                (game.#max_scope - game.#min_scope) / 10 - 19
            ) * 10;
            game.#scope.set(game.#player, f());
            game.#scope.set(!game.#player, f());
            game.#update_scope();
        }

        static #leak(count){
            let player = referee.publish(true);
            let peer = referee.publish(false);
            game.#event(
                `oops, look what slipped out:\n[peer] ${peer}\n[you] ${player}`
            );
            
            return count;
        }

        static #disorder(count){
            let player = referee.publish(true);
            let peer = referee.publish(false);
            game.#event(
                `oops, look what slipped out:\n[peer] ${player}\n[you] ${peer}`
            );
            
            return count;
        }

        static #crazy(count){
            
            let T = [
                "bribing the scoreboard",
                "referee not found",
                "feeding the seagulls",
                "damn you & peer keep harassing me",
                "sipping tea...."
            ];
            
            do{
                game.#event(
                    T[game.get_random(T.length)]
                );
            }while(game.get_random(3) < 2);
            
            return count;
        }


        static #fix(count){
            if(game.get_random(2) < 1){
                game.#event(
                    "wrench applied. ai tamed"
                );
                
                return 0;
            }else{
                game.#event(
                    "ai: 'nice try patching a wildfire, grandpa.'"
                );
                
                return count;
            }
        }

        static #deal(_ = null, notice = true){
            if(notice === true){
                game.#event("dealing from the bottom");
            }else{
                //pass
            }
            
            let card = document.getElementsByClassName("card");
            for(let c of card){
                c.dataset[game.#player] = game.#new_card_content();
                c.dataset[!game.#player] = game.#new_card_content();
                c.textContent = c.dataset[game.#player];
                c.className = `card`;
                game.#peer_selected.delete(c);
            }
        }

        static #cat(){
            game.#event("cat walking on keyboard");
            
            let card = document.getElementsByClassName("card");
            let rdi = () => game.get_random(card.length);
            let rnd = () => game.get_random(2) === 0;
            do{
                let L = card[rdi()];
                let R = card[rdi()];

                let cat = L.dataset[game.#player];
                L.dataset[game.#player] = R.dataset[!game.#player];
                R.dataset[!game.#player] = cat;
                
                L.textContent = L.dataset[game.#player];
                
                if(L.dataset[game.#player] === ``){
                    L.className = `card`;
                }else{
                    //pass
                }
                
                if(R.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(R);
                }else{
                    //pass
                }
            }while(rnd() === true);

            return true;
        }

        static #seagull(){
            game.#event("seagull stole my fries");
            
            game.#scope.set(
                game.#player,
                Math.abs(
                    game.#scope.get(
                        game.#player
                    )
                )
            );

            game.#scope.set(
                !game.#player,
                Math.abs(
                    game.#scope.get(
                        !game.#player
                    )
                )
            );

            game.#update_scope();

            return true;
        }
        
        static #squirrel(){
            game.#event("squirrel hoarded the seeds");
            game.#next_seed();

            return true;
        }

        static #monkey(){
            game.#event("monkey stole the referee's whistle");

            switch(game.get_random(5)){
                case 0:
                    dialog.notice("Rule Violation!").then(
                        () => {
                            game.init(false);
                            game.#steal();
                        }
                    );
                    return false;
                case 1:
                    dialog.notice("-_Draw_-").then(
                        () => game.init(false)
                    );
                    return false;
                case 2:
                    dialog.notice("^_Win_^").then(
                        () => game.init(false)
                    );
                    return false;
                case 3:
                    dialog.notice("T_Fail_T").then(
                        () => game.init(false)
                    );
                    return false;
                default:
                    game.#referee_vent("'referee'");
                    return true;
            }
            
        }

        static #animal_breaking_in(){
            let f = [
                game.#cat,
                game.#seagull,
                game.#squirrel,
                game.#monkey
            ];
            
            return f[game.get_random(f.length)]();
        }

        static #add(seed,card){
            return seed + card;
        }

        static #mul(seed,card){
            return seed * card;
        }
        
        static #next_seed(){
            let seed = document.getElementsByClassName("seed");
            for(let s of seed){
                s.textContent = game.#random_num_content(10,1);
            }
            peer.notice_next_seed(
                [...seed].map(s => s.textContent)
            );
        }
        
        static #update_scope(){
            let scope = document.getElementById("scope");
            let values = [...game.#scope.values()];
            if(values.find(
                e => 
                    e < (game.#min_scope - game.#flex_scope) 
                ||  e > (game.#max_scope + game.#flex_scope)
            ) !== undefined){
                //rule violation
                dialog.notice("Rule Violation!").then(
                    () => {
                        game.init(false);
                        game.#steal();
                    }
                );
            }else if(
                game.#scope.get(game.#player) >= game.#max_scope
             && game.#scope.get(!game.#player) >= game.#max_scope
            ){
                //both draw
                dialog.notice("-_Draw_-").then(
                    () => game.init(false)
                );
            }else if(game.#scope.get(game.#player) >= game.#max_scope){
                //player win
                dialog.notice("^_Win_^").then(
                    () => game.init(false)
                );
            }else if(game.#scope.get(!game.#player) >= game.#max_scope){
                //peer win
                dialog.notice("T_Fail_T").then(
                    () => game.init(false)
                );
            }else{
                let fscope = (t) => String(
                    game.#scope.get(t)
                ).padStart(game.#scope_fix," ");
                let player_scope = fscope(game.#player);
                let peer_scope = fscope(!game.#player);
                
                scope.textContent = `P ${peer_scope}\nY ${player_scope}`;
                peer.notice_scope_update(
                    peer_scope,
                    player_scope
                );
            }
        }

        static #random_num_content(sup, max_digits){
            return String(
                game.get_random(sup)
            ).padStart(max_digits,"0");
        }

        static #new_card_content(){
            let op = "+*";
            let random_op = op[game.get_random(op.length)];
            
            return `${random_op}${game.#random_num_content(100,2)}`;
        }

        static #new_card(self,isplayer){
            let content = game.#new_card_content();
            let id = game.#id(isplayer);
            
            let card = document.getElementsByClassName("card");
            let empty = 0;
            for(let c of card){
                empty = empty + (
                    c.dataset[id] === ``
                  ? 1
                  : 0
                );
            }
            
            if(self.dataset[id] === ``){
                
                let P = (
                    game.get_random(3) < 2
                  ? 1
                  : 0
                );
                game.#scope.set(
                    id,
                    game.#scope.get(id) 
                  - 10 * empty * P
                );
                
                self.dataset[id] = content;
            }else{
                //pass
            }
            self.textContent = self.dataset[game.#player];

            game.#update_scope();

        }
        
        static #referee_vent(referee = "referee"){
            game.#event(`the ${referee} chose violence`);
            
            let f = [
                game.#steal,
                game.#rescope,
                game.#retarget,
                game.#switch
            ];
            
            f[game.get_random(f.length)]();
        }

        static AI_hallucination(count){
            game.#event(
                "ai is hallucinating a better timeline..."
            );
            
            let f = [
                game.#leak,
                game.#disorder,
                game.#crazy,
                game.#fix
            ];
            
            return f[game.get_random(f.length)](count);
        }

        static get_random(sup){
            let next = new Uint32Array(1);
            next[0] = ~0;
            next[0] = Math.floor(next[0] * Math.random());
            window.crypto?.getRandomValues(next);
            return next[0] % sup;
        }

        static init(is_load = true){
            game.#scope.set(
                game.#player,
                game.#init_scope
            );
            game.#scope.set(
                !game.#player,
                game.#init_scope
            );
            game.#update_scope();
            
            game.#next_seed();
            
            game.#deal(null,false);
            
            game.#retarget(null,false);

            let card = document.getElementsByClassName("card");
            peer.notice_init(
                card.length,
                game.#min_scope,
                game.#max_scope,
                game.#flex_scope
            );

            if(is_load === false){
                return;
            }else{
                dialog.notice(
`\
$: you or peer
@: other of $, 
     e.g. $ is you, then @ is peer
-------
S:  blue, 0~9, shared
C($):  cards for $, tap to select(green),
    #N:  N is 0~99, # is + or *
    <empty slot>: tap to buy,
    2/3 probability cost 10* empty,
    otherwise free
T: seagreen, 0~9, shared
------
PLAY: 
      1. 5 ‰, animal break in
      2. anyone play 0 cards
         referee attack boths
      3.  R($) = (S C($)),
          for each S and selected C($)
          e.g. S = [1,2] and C($) = [+3,*4],
               R($) = [(1 +3),(2 +3),(1 *4),(2 *4)]
                    = [4,5,4,8]
      4. C($) turn into <empty slot>
      5. k(@)  factor for @,
         init k(@) = 1
      6. d($) diff scope of $,
         init d($) = 0
      7. how to prepare modify:
            for each r of R:
                r mod 10 = T: 
                    k(@) = k(@) * (-1)
                r results from +N:
                    P(@) evens probilitiy of @
                    E($) = round(P(@)* 60)
                    (hint:  E = 37, in classic)
                    K = abs((r-20) - E($))
                    
                    d($) = d($) + 10 * round(
                       50 * (
                          e^(-K/Math.PI) - e^(-Math.PI)
                       )
                    )
                  (
                     hint: where K < 10, d($) is plus positive;
                     max plus  480 at K = 0;
                     min -20
                  )
                 r results from *N:
                     s = sum(sgn(r - R(@)))
                     d($) = d($) + 10 * s
      8. The real modify of $, is k($) * d($)
      9.  95% probability at most,
          AI hallucination 
VENT:  when you need or just
            want to attack referee.
           so does other.
          referee promise attack boths 
          in each 10 VENT(includes others).
<following is not updated>
------
scope: 
      if anyone scope < ${game.#min_scope - game.#flex_scope} 
      or scope > ${game.#max_scope + game.#flex_scope}:
        Rule Violation
      else if both >= ${game.#max_scope}
        Draw
      else if only your >= ${game.#max_scope}:
        (you) Win
      else if only peer >= ${game.#max_scope}:
        (peer) Win, aka (You) Fail
      NOTE： Y = you, P = peer
------
[attack a referee] will 
cause one of following:
   mug:  you and peer are muggings each other,
         at least one times.
         if you succeed, you discard your card
         and get peer card, includes used.
   steal: random marked used card,
          for you and peer
   demand: (scope + 200) for you,
           (scope - 200) for peer,
   discard: (scope - 200) for you,
            (scope + 200) for peer
   retarget: random new target
   switch: swap you and peer
   deal: you and peer will get 
         whole new cards
[attack you and peer] will
cause one of following:
   steal: random marked used card,
          for you and peer
   rescope: random scope,
            ${(game.#min_scope + 100) + (0) * 10} <= scope and 
            scope <= ${
                (game.#min_scope + 100) + (
                    (game.#max_scope - game.#min_scope) / 10 - 20
                ) * 10
            },
            for you and peer
   retarget: random new target
   switch: swap you and peer
[animal breaking in] will
cause one of following:
   cat: cat rush on table,
        swap card across
        you and peer
   seagull: seagull eats fries,
            aka minus
   squirrel: squirrel treats seeds
             as nuts, so we need
             new seeds
   monkey: monkey imitate referee,
           maybe it end the game,
           maybe it desides to
           attack you and peer
[hallucination] will
cause one of following:
    leak: AI leat you and peer
          count of +card 
          and *card in past
    disorder: same as leak,
              but disorder
    crazy: nonsense of AI
    fix: referee try to fix AI,
         maybe failed
`
                );
            }
        }
        
        static player_select(self){
            if(self.className === `card`){
                game.#new_card(self,true);
                self.className = `card selected`;
            }else{
                self.className = `card`;
            }

            peer.notice_take_action();
        }

        static *peer_select(){
            let card = document.getElementsByClassName("card");

            for(let c of card){
                let is_select = (yield c.dataset[!game.#player]);
                if( is_select === true){
                    game.#new_card(c,false);
                    game.#peer_selected.add(c);
                }else if( is_select === false){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
        }

        static play(){
            if(
                game.get_random(1000) < 5
            &&  game.#animal_breaking_in() === false
            ){
                return;
            }else{
                //pass
            }

            let seed = document.getElementsByClassName("seed");
            let target = document.getElementById("target");
            let player = document.getElementsByClassName("selected");
            let peer = game.#peer_selected;

            if(player.length === 0 || peer.size === 0){
                game.#referee_vent();
                return;
            }else{
                //pass
            }

            let error = () => {
                dialog.notice("Data Tampering!!!").then(
                    () => location.reload()
                );
            };
            let int = (s, sup) => {
                let n = Number.parseInt(s,10);
                if(Number.isNaN(n) === true || n < 0 || n >= sup){
                    error();
                }else{
                    return n;
                }
            };
            let trans = (t,isplayer) => {
                let r = new Map();
                if( t[0] === "+"){
                    referee.remember(t[0],isplayer);
                    
                    r.set("f",game.#add);
                } else if ( t[0] === "*" ){
                    referee.remember(t[0],isplayer);
                    
                    r.set("f",game.#mul);
                } else{
                    error();
                }
                
                r.set(
                    "card", 
                    int(t.slice(1),100)
                );
                return r;
            };
            
            seed = [...seed].map(
                s => int(s.textContent,10)
            );
            target = int(target.textContent,10);
            
            player = [...player].map(
                p => {
                    let t = p.dataset[game.#player];
                    p.dataset[game.#player] = "";
                    p.textContent = p.dataset[game.#player];
                    p.className = `card`;
                    return trans(t,true);
                }
            );
            peer = [...peer].map(
                p => {
                    let t = p.dataset[!game.#player];
                    p.dataset[!game.#player] = "";
                    game.#peer_selected.delete(p);
                    return trans(t,false);
                }
            );

            
            let calculate = (cards) => cards.flatMap(
                c => seed.map(
                    s => {
                        let r = new Map();
                        
                        r.set(
                            "f",
                            c.get("f")
                        );
                        
                        r.set(
                            "val",
                            c.get("f")(
                                s,
                                c.get("card")
                            )
                        );
                        
                        return r;
                    }
                )
            );
            let result = (calculated) => calculated.map(
                c => c.get("val")
            );

            player = calculate(player);
            
            peer = calculate(peer);

            let fscope = (calculated,other_results) => {
                let other_sgn = 1;
                let ds = 0;
                
                for(let c of calculated){
                    let val = c.get("val");
                    let f = c.get("f");
                    
                    if( (val % 10) === target ){
                        other_sgn = other_sgn * (-1);
                    }else if(f === game.#add){
                        let C = other_results.length;
                        let S = Math.round(
                            (
                                C - Math.sumPrecise(
                                    other_results.map( p => p % 2 )
                                )
                            ) / C * 60
                        );
                        let K = Math.abs((val - 20) - S);
                        
                        ds = ds + 10 * Math.round(
                            50 * (
                                Math.exp(-K/Math.PI) - Math.exp(-Math.PI)
                            )
                        );
                    }else if(f === game.#mul){
                        let s = Math.sumPrecise(
                            other_results.map(
                                p => Math.sign(val - p)
                            )
                        );

                        ds = ds + 10 * s;
                    }else{
                        //pass
                    }
                }
                
                return [other_sgn,ds];
            };

            let [peer_sgn, player_ds] = fscope(
                player,
                result(peer)
            );

            let [player_sgn,peer_ds] = fscope(
                peer,
                result(player)
            );
            
            game.#scope.set(
                game.#player,
                game.#scope.get(game.#player)
              + player_sgn * player_ds
            );
            
            game.#scope.set(
                !game.#player,
                game.#scope.get(!game.#player)
              + peer_sgn * peer_ds
            );

            game.#next_seed();

            game.#update_scope();

            referee.count();
        }

        static vent(isplayer){
            if(isplayer === false){
                game.#event("peer says 'screw the rules'",false,true);
            }else{
                game.#event("player screaming at the umpire",true,false);
            }

            let f = [
                game.#mug,
                game.#steal,
                game.#demand,
                game.#discard,
                game.#retarget,
                game.#switch,
                game.#deal
            ];
            
            f[game.get_random(f.length)](
                game.#id(isplayer)
            );

            if(referee.attacked() === true){
                game.#referee_vent("pushed-to-the-edge referee");
            }else{
                //pass
            }
            
            peer.notice_take_action();
            
        }
        
    }

    //a simple peer
    class peer{
        static #seeds;
        static #target;
        static #my_scope;
        static #it_scope;
        static #card_counts;
        static #min_scope;
        static #max_scope;
        static #flex_scope;
        
        static #P_plus = 0.5;
        
        static notice_init(
            card_counts,
            min_scope,
            max_scope,
            flex_scope
        ){
            peer.#card_counts = card_counts;
            peer.#min_scope = min_scope;
            peer.#max_scope = max_scope;
            peer.#flex_scope = flex_scope;
        }
        
        static notice_next_seed(seeds){
            peer.#seeds = seeds.map(
                s => Number.parseInt(s,10)
            );
        }
        
        static notice_retarget(target){
            peer.#target = Number.parseInt(
                target,
                10
            );
        }

        static notice_scope_update(peer_scope,player_scope){
            peer.#my_scope = Number.parseInt(
                peer_scope,
                10
            );
            peer.#it_scope = Number.parseInt(
                player_scope,
                10
            );
        }

        static watch_event(content){
            let match = content.match(/\[you\] (?<plus>\d+) \+card, (?<mul>\d+) \*card/u);
            if (match !== null){
                let { plus,mul } = match.groups;
                plus = Number.parseInt(plus,10);
                mul =  Number.parseInt(mul,10);
                peer.#P_plus = plus / (plus + mul);
            }else{
                //pass
            }
        }

        static notice_take_action(){
            let empty_counts = peer.#empty_counts();
            let min = (200 + peer.#min_scope);
            let sup = (peer.#max_scope - 800);
            if(
                peer.#deside(
                    [peer.#my_scope,peer.#it_scope].every(
                        s => s >= min 
                          && s < sup
                    ),
                    Math.max(
                        0,
                        peer.#it_scope - peer.#my_scope
                    ),
                    sup - min
                ) === true ||
                peer.#deside(
                    2 * empty_counts > peer.#card_counts,
                    empty_counts,
                    peer.#card_counts
                ) === true
            ){
                game.vent(false);
            }else{
                let cards = game.peer_select();
                let select_it = false;
                for(
                    let card = cards.next();
                    card.done === false;
                    card = cards.next(select_it)
                ){
                    if(card.value === ``){
                        select_it = peer.#deside(
                            peer.#my_scope >= (
                                peer.#min_scope - peer.#flex_scope + (10 * empty_counts)
                            ),
                            2 * peer.#card_counts - empty_counts,
                            2 * peer.#card_counts + 1
                        );
                        empty_counts = empty_counts - (
                            (select_it === true)? 1 : 0
                        );
                    }else if(card.value[0] === "+"){
                        select_it = peer.#add_card(
                            Number.parseInt(
                                card.value.slice(1),
                                10
                            )
                        );
                    }else if(card.value[0] === "*"){
                        select_it = peer.#mul_card(
                            Number.parseInt(
                                card.value.slice(1),
                                10
                            )
                        );
                    }else{
                        select_it = false;
                    }
                }
            }
        }


        static #deside(base,p,q){
            return base && game.get_random(q) < p;
        }

        static #empty_counts(){
            let counts = 0;
            for(let c of game.peer_select()){
                counts = counts + (
                    c === `` ? 1 : 0
                );
            }
            return counts;
        }

        static #add_card(card){
            let result = peer.#seeds.map( s => s + card);
            let S = peer.#seeds.length;

            let odds = Math.sumPrecise(
                peer.#seeds.map( p => p % 2)
            );
            let evens = S - odds;
            let E = 60 * (
                peer.#P_plus * (
                    (1/2) * (odds/S)
                  + (1/2) * (evens/S)
                ) + (1 - peer.#P_plus) * (
                    (1/2) * (odds/S)
                  + (1) * (evens/S)
                )
            );
            E = Math.round(E);
            
            let s = 0;
            let K = (R) => Math.abs((R - 20) - E);
            
            
            for(let r of result){ 
                if((r % 10) === peer.#target){
                    s = s + 5;
                }else if(
                    K(r) <= 10
                ){
                    s = s + 10;
                }else{
                    s = s + 5;
                }
            }

            return peer.#deside(
                true,
                s,
                10 * S
            );
        }

        static #mul_card(card){
            let result = peer.#seeds.map( s => s * card );
            let S = peer.#seeds.length;
            
            let max = Math.max(...peer.#seeds);
            let min = Math.min(...peer.#seeds);
            let fmock = t => (mc,i) => (mc / 8) * (
                (t + (i + 1) * 25)
              + (t * (i + 1) * 25)
            );
            let mock = [1,1,2];
            max = Math.sumPrecise(
                mock.map(fmock(max))
            );
            min = Math.sumPrecise(
                mock.map(fmock(min))
            );
            let E = (max + min) / 2;
            
            
            let s = 0;
            for(let r of result){
                if((r % 10) === peer.#target){
                    s = s + 5;
                }else if(r >= E){
                    s = s + 10;
                }else{
                    s = Math.max(0,s - 5);
                }
            }
            
            return peer.#deside(
                true,
                s,
                10 * S
            );
        }
    }
    
    class referee{
        static #history = new Map();
        static #be_vent = 0;
        static #mem_count = 0;
        
        static{
            referee.#history.set(
                true,
                new Map(
                    [
                        ["+",0],
                        ["*",0]
                    ]
                )
            );
            referee.#history.set(
                false,
                new Map(
                    [
                        ["+",0],
                        ["*",0]
                    ]
                )
            );
        }

        static count(){
            referee.#mem_count = referee.#mem_count + 1;
            let P = (x) => Math.floor(300 / (Math.PI * (1 + Math.exp(10 - x/2)))); 
            // max(P(x)) = 95
            if(
                game.get_random(100) < P(referee.#mem_count)
            ){
                referee.#mem_count = game.AI_hallucination(
                    referee.#mem_count
                );
            }else{
                //pass
            }
        }
        
        static remember(tp,is_player){
            let T = referee.#history.get(
                is_player
            );
            
            T.set(
                tp,
                T.get(tp) + 1
            );
        }

        static publish(is_player){
            let T = referee.#history.get(
                is_player
            );
            
            return `${T.get("+")} +card, ${T.get("*")} *card`;
        }

        static attacked(){
            referee.#be_vent = referee.#be_vent + 1;
            if(
                game.get_random(10) < referee.#be_vent
            ){
                referee.#be_vent = 0;
                return true;
            }else{
                return false;
            }
        }
    }
    
</script>
