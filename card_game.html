<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,height=device-height,
                                   initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,
                                   user-scalable=no"/>
</head>
<script>
    class game{

        static #player = true;
        
        static #scope = new Map();

        static #peer_selected = new Set();

        /*NOTE: those requires unchecked*/
        
        // min_scope % 10 === 0
        static #min_scope = 0;
        // max_scope % 10 === 0
        // && max_scope >= min_scope + 200
        static #max_scope = 64000;
        // flex_scope >= 0 && flex_scope % 10 === 0
        static #flex_scope = 64000;
        //    min_scope <= init_scope
        // && init_scope <= max_scope
        // && init_scope % 10 === 0
        static #init_scope = 32000;
        // max chars of N, where
        //    (min_scope - flex_scope) <= N
        // && N <= (max_scope + flex_scope)
        static #scope_fix = 6;
        
        static #d_player = 0;
        static #d_peer = 0;

        //display duration, in ms
        static #each_event_display = 3000;
        
        static #event_promise = Promise.resolve();
        //manual by Claude
        //doc is not update.
        static #MAN = `\
$: you or peer
@: other of $, 
     e.g. $ is you, then @ is peer
-------
S:  blue, 0~9, shared
C($):  cards for $, tap to select(green),
    #N:  N is 0~99, # is + or *
    <empty slot>: tap to buy,
    price: see BUY
T: cadetblue, 0~9, shared
------
PLAY:
 1. each PLAY: 5‰ chance,
    animal breaks in
 2. either side selects 0 cards:
    referee attacks both
 3. R($) = (S C($)),
    for each S and selected C($)
    e.g. S = [1,2],
         C($) = [+3,*4]
         R($) = [(1 +3),(2 +3),
                 (1 *4),(2 *4)]
              = [4,5,4,8]
 4. C($) turn into <empty slot>,
    then KYC (see KYC)
 5. m(@): sign factor for @,
    init m(@) = 1
 6. d($): score gain of $,
    init d($) = 0
 7. for each r of R:
    (a) r mod 10 = T (hit):
        d($) gets nothing,
        m(@) = m(@) * (-1)
    (b) r from +N:
        q(@): share of even
        results of @, this PLAY
        E = round(q(@) * 60)
        (classic: half + half *,
         E is about 37)
        K = abs((r-20) - E)
        d($) += 10 * round(
          200 * (e^(-K/(2*pi))
                 - e^(-pi)))
        K = 0:        +1910
        1 <= K <= 19: positive
        K = 20:       0
        K >= 21:      negative,
                      min -90
        e.g. T=3, E=37,
             S=[5,7], C=+50
             r=[55,57], K=[2,0]
             d = 1370 + 1910
               = 3280
    (c) r from *N:
        x = r mod (T + 1)
        d($) += 10 * round(
          (10 + 10*sgn(x)) * (
            e^(-x/(2*pi))
            - sgn(x)*e^(-1/(2*pi))))
        x = 0:  +100
        x = 1:  0
        x >= 2: negative,
                min -120 (x = 9)
 8. real change of $ is
    m($) * d($)
 9. after each PLAY, AI may
    hallucinate; chance grows
    with PLAY count, max 95%
VENT:  when you need or just
       want to attack referee.
       so does peer.
       each VENT (either side)
       adds 10% to the chance
       that referee attacks
       both; certain at the
       10th, then resets.
------
BUY:
 empty = empty slots of $
 before this purchase
 empty <= 12:
   pay 10*empty
 empty >= 13:
   pay round(2*e^(empty-8))
   13: 297    14: 807
   15: 2193   16: 5962
 always pay, no free buys.
 refill all 16 slots from
 nothing: 10039
------
KYC:
 after PLAY, n = count of
 C($) that $ played
 n <= 4:
   'Minimum spend unmet'
   all C($) of $ are wiped,
   next buy is the priciest
   (empty = 16)
 n >= 12:
   'Over-spending bonus'
   4 random <empty slot>
   of $ get new cards, free
 5 <= n <= 11: nothing
 you only see the message
 for your own cards
------
SCOPE:  P = peer, Y = you
 start at ${game.#init_scope}
 goal:  >= ${game.#max_scope}
 you only:   (you) Win
 peer only:  (peer) Win,
             aka (You) Fail
 both:       Draw
 safe range:
   ${game.#min_scope - game.#flex_scope} ~ ${game.#max_scope + game.#flex_scope}
 either one outside:
   Rule Violation
   (restart, hands half stolen)
 scope moves by:
   PLAY (7, 8)
   buying card (see BUY)
   events below
------
EVENT:
 many events can fire.
 '....' = keyword you see in
 the message on top.
 no list under it: the
 message is just for info.

[VENT]
 one of:
 'turf war' (mug):
   a random slot of one side
   is overwritten by a random
   slot of the other, which
   becomes empty. who takes
   is random, repeats at 1/2
 'master thief' (steal):
   each card of you and peer
   vanishes at 1/2
 'nice scope' (demand):
   venting side +200,
   other side -200
 'generous donation' (discard):
   venting side -200,
   other side +200
 'goalposts' (retarget):
   new random target
 'uno reverse' (switch):
   swap you and peer
 'dealing from the bottom':
   whole new cards for both
 then the referee may hit
 back, see [referee attacks
 both]

[referee attacks both]
 when: either side plays 0
 cards, the VENT count hits,
 or the monkey decides so.
 one of:
 'master thief':  as above
 'goalposts':     as above
 'uno reverse':   as above
 'inflation strikes' (rescope):
   both scopes random,
   ${game.#min_scope + 100} ~ ${game.#max_scope - 100}
 'forced purchase' (force_buy):
   every <empty slot> of you
   and peer is bought, each
   at the price of that
   moment (from nothing:
   10039 each)
 'Replay attack' (replay):
   last PLAY's change (m * d)
   is added again to 'you'
   and 'peer' as they are
   now, so after 'uno reverse'
   it lands on the other side.
   starts at 0, never cleared
   (not even by a restart)
 'auto-dump' (insteadOf):
   a side that selected
   nothing gets all 16 slots
   bought and selected,
   then PLAY runs at once
   (KYC applies)

[animal breaks in]
 5‰ each PLAY, one of:
 'cat walking on keyboard':
   swap cards across you and
   peer, repeats at 1/2
 'seagull stole my fries':
   negative scopes turn
   positive
 'squirrel hoarded the seeds':
   new seeds
 'monkey stole':
   1/5 each: Rule Violation,
   Draw, Win, Fail (round
   ends); other 1/5: the
   referee attacks both

[AI hallucination]
 after PLAY, chance rises with
 PLAY count (max 95%), one of:
 'slipped out':
   AI leaks how many +cards
   and *cards each side has
   played. may be disordered:
   [peer] and [you] swapped,
   you can't tell which
 'bribing the scoreboard' etc:
   nonsense lines, info only
 'wrench applied':
   (fix) PLAY count back to
   0, the AI calms down
 'nice try patching':
   (fix failed) nothing`;
        

        static #id(isplayer){
            return (
                (isplayer === true) 
                ?  (game.#player) 
                :  (!game.#player)
            );
        }

        static #name(id){
            return (
                (id === game.#player)
                ? "you"
                : "peer"
            );
        }

        static #event(content,peer_watch = true,player_watch = true){
            let e = document.getElementById("event");

            game.#event_promise = game.#event_promise.then(
                () => {
                    if(peer_watch === true){
                        peer.watch_event(content);
                    }else{
                        //pass
                    }
                    
                    if(player_watch === true){
                        e.textContent = content;
                        e.style.visibility = "visible";
                        return new Promise(
                            (resolve,reject) => setTimeout(
                                resolve,
                                game.#each_event_display
                            )
                        );
                    }else{
                        return;
                    }
                }
            ).then(
                () => {
                    e.style.visibility = "hidden";
                }
            );       
        }

        static #switch(_ = null){
            game.#event("uno reverse!");
            
            game.#player = !game.#player;
            let card = document.getElementsByClassName("card"); 
            for(let c of card){
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                   //pass 
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
            game.#update_scope();
        }
        
        static #steal(_ = null){
            game.#event("a master thief strikes");
            
            let card = document.getElementsByClassName("card");
            let thf = (c) => (game.get_random(2) === 0)? c : ``;
            for(let c of card){
                c.dataset[game.#player] = thf(c.dataset[game.#player]);
                c.dataset[!game.#player] = thf(c.dataset[!game.#player]);
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                   //pass 
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
        }

        static #mug(_ = null){
            game.#event("black-market turf war");
            
            let card = document.getElementsByClassName("card");
            let rdi = () => game.get_random(card.length);
            let rnd = () => game.get_random(2) === 0;
            
            let res = (c) => {
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                    //pass
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            };
            
            let fmug = (a,b) => {
                let A = card[rdi()];
                let B = card[rdi()];
                A.dataset[a] = B.dataset[b];
                B.dataset[b] = ``;
                res(A);
                res(B);
            };
            
            do {
                if( rnd() === true ){
                    fmug(
                        game.#player,
                        !game.#player
                    );
                }else{
                    fmug(
                        !game.#player,
                        game.#player
                    );
                }  
            } while (rnd() === true);
        }
        
        static #demand(id){
            game.#event(`${game.#name(id)}: nice scope you got there...`);
                
            game.#scope.set(
                id,
                game.#scope.get(id) + 200
            );
            game.#scope.set(
                !id,
                game.#scope.get(!id) - 200
            );
            game.#update_scope();
        }
        
        static #discard(id){
            game.#event(`${game.#name(id)}: generous donation`);
            
            game.#scope.set(
                id,
                game.#scope.get(id) - 200
            );
            game.#scope.set(
                !id,
                game.#scope.get(!id) + 200
            );
            game.#update_scope();
        }

        static #retarget(_ = null, notice = true){
            if(notice === true){
                game.#event("moving the goalposts");
            }else{
                //pass
            }
            
            let target = document.getElementById("target");
            target.textContent = game.#random_num_content(10,1);
            peer.notice_retarget(target.textContent);
        }
        
        static #rescope(_ = null){
            game.#event("inflation strikes");

            let f = () => (game.#min_scope + 100) + game.get_random(
                (game.#max_scope - game.#min_scope) / 10 - 19
            ) * 10;
            game.#scope.set(game.#player, f());
            game.#scope.set(!game.#player, f());
            game.#update_scope();
        }

        static #force_buy(_ = null){
            game.#event("Umpire turned Vendor: forced purchase!");
            let card = document.getElementsByClassName("card");
            for(let c of card){
                game.#new_card(c,true);
                game.#new_card(c,false);
            }
        }

        static #replay(_ = null){
            game.#event("Replay attack: double pain!");
            
            game.#scope.set(
                game.#player,
                game.#scope.get(game.#player)
              + game.#d_player
            );
            
            game.#scope.set(
                !game.#player,
                game.#scope.get(!game.#player)
              + game.#d_peer
            );
            
            game.#update_scope();
        }

        static #insteadOf(_ = null){
            game.#event("Umpire playing empty hands: full auto-dump!");
            
            let player = document.getElementsByClassName("selected").length;
            let peer = game.#peer_selected.size;
            
            if(player === 0){
                let card = document.getElementsByClassName("card");
                for(let c of card){
                    game.#new_card(c,true);
                    c.className = `card selected`;
                }
            }else{
                //pass
            }

            if(peer === 0){
                let cards= game.peer_select();
                for(
                    let card = cards.next();
                    card.done === false;
                    card = cards.next(true)
                ){}
            }else{
                //pass
            }

            game.play();
        }
        

        static #leak(count){
            let player = referee.publish(true);
            let peer = referee.publish(false);
            game.#event(
                `oops, look what slipped out:\n[peer] ${peer}\n[you] ${player}`
            );
            
            return count;
        }

        static #disorder(count){
            let player = referee.publish(true);
            let peer = referee.publish(false);
            game.#event(
                `oops, look what slipped out:\n[peer] ${player}\n[you] ${peer}`
            );
            
            return count;
        }

        static #crazy(count){
            
            let T = [
                "bribing the scoreboard",
                "referee not found",
                "feeding the seagulls",
                "damn you & peer keep harassing me",
                "sipping tea...."
            ];
            
            do{
                game.#event(
                    T[game.get_random(T.length)]
                );
            }while(game.get_random(3) < 2);
            
            return count;
        }


        static #fix(count){
            if(game.get_random(2) < 1){
                game.#event(
                    "wrench applied. ai tamed"
                );
                
                return 0;
            }else{
                game.#event(
                    "ai: 'nice try patching a wildfire, grandpa.'"
                );
                
                return count;
            }
        }

        static #deal(_ = null, notice = true){
            if(notice === true){
                game.#event("dealing from the bottom");
            }else{
                //pass
            }
            
            let card = document.getElementsByClassName("card");
            for(let c of card){
                c.dataset[game.#player] = game.#new_card_content();
                c.dataset[!game.#player] = game.#new_card_content();
                c.textContent = c.dataset[game.#player];
                c.className = `card`;
                game.#peer_selected.delete(c);
            }
        }
        
        static #cat(){
            game.#event("cat walking on keyboard");
            
            let card = document.getElementsByClassName("card");
            let rdi = () => game.get_random(card.length);
            let rnd = () => game.get_random(2) === 0;
            do{
                let L = card[rdi()];
                let R = card[rdi()];

                let cat = L.dataset[game.#player];
                L.dataset[game.#player] = R.dataset[!game.#player];
                R.dataset[!game.#player] = cat;
                
                L.textContent = L.dataset[game.#player];
                
                if(L.dataset[game.#player] === ``){
                    L.className = `card`;
                }else{
                    //pass
                }
                
                if(R.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(R);
                }else{
                    //pass
                }
            }while(rnd() === true);

            return true;
        }

        static #seagull(){
            game.#event("seagull stole my fries");
            
            game.#scope.set(
                game.#player,
                Math.abs(
                    game.#scope.get(
                        game.#player
                    )
                )
            );

            game.#scope.set(
                !game.#player,
                Math.abs(
                    game.#scope.get(
                        !game.#player
                    )
                )
            );

            game.#update_scope();

            return true;
        }
        
        static #squirrel(){
            game.#event("squirrel hoarded the seeds");
            game.#next_seed();

            return true;
        }

        static #monkey(){
            game.#event("monkey stole the referee's whistle");

            switch(game.get_random(5)){
                case 0:
                    dialog.notice("Rule Violation!").then(
                        () => {
                            game.init(false);
                            game.#steal();
                        }
                    );
                    return false;
                case 1:
                    dialog.notice("-_Draw_-").then(
                        () => game.init(false)
                    );
                    return false;
                case 2:
                    dialog.notice("^_Win_^").then(
                        () => game.init(false)
                    );
                    return false;
                case 3:
                    dialog.notice("T_Fail_T").then(
                        () => game.init(false)
                    );
                    return false;
                default:
                    game.#referee_vent("'referee'");
                    return true;
            }
            
        }

        static #animal_breaking_in(){
            let f = [
                game.#cat,
                game.#seagull,
                game.#squirrel,
                game.#monkey
            ];
            
            return f[game.get_random(f.length)]();
        }

        static #add(seed,card){
            return seed + card;
        }

        static #mul(seed,card){
            return seed * card;
        }
        
        static #next_seed(){
            let seed = document.getElementsByClassName("seed");
            for(let s of seed){
                s.textContent = game.#random_num_content(10,1);
            }
            peer.notice_next_seed(
                [...seed].map(s => s.textContent)
            );
        }
        
        static #update_scope(){
            let scope = document.getElementById("scope");
            let values = [...game.#scope.values()];
            if(values.find(
                e => 
                    e < (game.#min_scope - game.#flex_scope) 
                ||  e > (game.#max_scope + game.#flex_scope)
            ) !== undefined){
                //rule violation
                dialog.notice("Rule Violation!").then(
                    () => {
                        game.init(false);
                        game.#steal();
                    }
                );
            }else if(
                game.#scope.get(game.#player) >= game.#max_scope
             && game.#scope.get(!game.#player) >= game.#max_scope
            ){
                //both draw
                dialog.notice("-_Draw_-").then(
                    () => game.init(false)
                );
            }else if(game.#scope.get(game.#player) >= game.#max_scope){
                //player win
                dialog.notice("^_Win_^").then(
                    () => game.init(false)
                );
            }else if(game.#scope.get(!game.#player) >= game.#max_scope){
                //peer win
                dialog.notice("T_Fail_T").then(
                    () => game.init(false)
                );
            }else if(
                game.#scope.get(game.#player) <= game.#min_scope
             && game.#scope.get(!game.#player) <= game.#min_scope
            ){
                //both draw
                dialog.notice("-_Draw_-").then(
                    () => game.init(false)
                );
            }else if(game.#scope.get(game.#player) <= game.#min_scope){
                //player fail
                dialog.notice("T_Fail_T").then(
                    () => game.init(false)
                );
            }else if(game.#scope.get(!game.#player) <= game.#min_scope){
                //peer fail
                dialog.notice("^_Win_^").then(
                    () => game.init(false)
                );
            }else{
                let fscope = (t) => String(
                    game.#scope.get(t)
                ).padStart(game.#scope_fix," ");
                let player_scope = fscope(game.#player);
                let peer_scope = fscope(!game.#player);
                
                scope.textContent = `P ${peer_scope}\nY ${player_scope}`;
                peer.notice_scope_update(
                    peer_scope,
                    player_scope
                );
            }
        }

        static #random_num_content(sup, max_digits){
            return String(
                game.get_random(sup)
            ).padStart(max_digits,"0");
        }

        static #new_card_content(){
            let op = "+*";
            let random_op = op[game.get_random(op.length)];
            
            return `${random_op}${game.#random_num_content(100,2)}`;
        }

        static #new_card(self,isplayer){
            let content = game.#new_card_content();
            let id = game.#id(isplayer);
            
            let card = document.getElementsByClassName("card");
            let empty = 0;
            for(let c of card){
                empty = empty + (
                    c.dataset[id] === ``
                  ? 1
                  : 0
                );
            }
            
            if(self.dataset[id] === ``){
                if(empty <= 12){
                    game.#scope.set(
                        id,
                        game.#scope.get(id) 
                        - 10 * empty
                    );
                }else{
                    game.#scope.set(
                        id,
                        game.#scope.get(id) 
                        - Math.round(
                            2 * Math.exp(empty - 8)
                        )
                    );
                }
                
                self.dataset[id] = content;
            }else{
                //pass
            }
            self.textContent = self.dataset[game.#player];

            game.#update_scope();

        }
        
        static #referee_vent(referee = "referee"){
            game.#event(`the ${referee} chose violence`);
            
            let f = [
                game.#steal,
                game.#rescope,
                game.#retarget,
                game.#switch,
                game.#force_buy,
                game.#replay,
                game.#insteadOf
            ];
            
            f[game.get_random(f.length)]();
        }

        static AI_hallucination(count){
            game.#event(
                "ai is hallucinating a better timeline..."
            );
            
            let f = [
                game.#leak,
                game.#disorder,
                game.#crazy,
                game.#fix
            ];
            
            return f[game.get_random(f.length)](count);
        }

        static #kyc(selected_cards,id){
            let cards = document.getElementsByClassName("card");
            
            if(selected_cards.length <= 4){
                game.#event(
                    "Minimum spend unmet. Auto-upgraded to maximum tariff. You're welcome.",
                    id === (!game.#player),
                    id === game.#player   
                );
                
                for(let c of cards){
                    c.dataset[id] = "";
                    c.textContent = c.dataset[game.#player];
                    if(c.dataset[game.#player] === ``){
                        c.className = `card`;
                    }else{
                        //pass
                    }
                    if(c.dataset[!game.#player] === ``){
                        game.#peer_selected.delete(c);
                    }else{
                        //pass
                    }
                }
            }else if(selected_cards.length >= 12){
                game.#event(
                    "Over-spending bonus triggered: complimentary cards injected. No refunds.",
                    id === (!game.#player),
                    id === game.#player   
                );
                
                let empty_slot = [];
                for(let c of cards){
                    if(c.dataset[id] === ""){
                        empty_slot.push(c);
                    }else{
                        //pass
                    }
                }
                
                for(let i = 0; i < 4; i++){
                    let k = game.get_random(empty_slot.length);
                    let c = empty_slot[k];
                    c.dataset[id] = game.#new_card_content();
                    c.textContent = c.dataset[game.#player];
                    empty_slot.splice(k,1);
                }
            }else{
                //pass
            }
        }

        static get_random(sup){
            let next = new Uint32Array(1);
            next[0] = ~0;
            next[0] = Math.floor(next[0] * Math.random());
            window.crypto?.getRandomValues(next);
            return next[0] % sup;
        }

        static init(is_load = true){
            game.#scope.set(
                game.#player,
                game.#init_scope
            );
            game.#scope.set(
                !game.#player,
                game.#init_scope
            );
            game.#update_scope();
            
            game.#next_seed();
            
            game.#deal(null,false);
            
            game.#retarget(null,false);

            let card = document.getElementsByClassName("card");
            peer.notice_init(
                card.length,
                game.#min_scope,
                game.#max_scope,
                game.#flex_scope
            );

            if(is_load === false){
                return;
            }else{
                dialog.notice(game.#MAN);
            }
        }
        
        static player_select(self){
            if(self.className === `card`){
                game.#new_card(self,true);
                self.className = `card selected`;
            }else{
                self.className = `card`;
            }

            peer.notice_take_action();
        }

        static *peer_select(){
            let card = document.getElementsByClassName("card");

            for(let c of card){
                let is_select = (yield c.dataset[!game.#player]);
                if( is_select === true){
                    game.#new_card(c,false);
                    game.#peer_selected.add(c);
                }else if( is_select === false){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
        }

        static play(){
            if(
                game.get_random(1000) < 5
            &&  game.#animal_breaking_in() === false
            ){
                return;
            }else{
                //pass
            }

            let seed = document.getElementsByClassName("seed");
            let target = document.getElementById("target");
            let player = document.getElementsByClassName("selected");
            let peer = game.#peer_selected;

            if(player.length === 0 || peer.size === 0){
                game.#referee_vent();
                return;
            }else{
                //pass
            }

            let error = () => {
                dialog.notice("Data Tampering!!!").then(
                    () => location.reload()
                );
            };
            let int = (s, sup) => {
                let n = Number.parseInt(s,10);
                if(Number.isNaN(n) === true || n < 0 || n >= sup){
                    error();
                }else{
                    return n;
                }
            };
            let trans = (t,isplayer) => {
                let r = new Map();
                if( t[0] === "+"){
                    referee.remember(t[0],isplayer);
                    
                    r.set("f",game.#add);
                } else if ( t[0] === "*" ){
                    referee.remember(t[0],isplayer);
                    
                    r.set("f",game.#mul);
                } else{
                    error();
                }
                
                r.set(
                    "card", 
                    int(t.slice(1),100)
                );
                return r;
            };
            
            seed = [...seed].map(
                s => int(s.textContent,10)
            );
            target = int(target.textContent,10);
            
            player = [...player].map(
                p => {
                    let t = p.dataset[game.#player];
                    p.dataset[game.#player] = "";
                    p.textContent = p.dataset[game.#player];
                    p.className = `card`;
                    return trans(t,true);
                }
            );
            peer = [...peer].map(
                p => {
                    let t = p.dataset[!game.#player];
                    p.dataset[!game.#player] = "";
                    game.#peer_selected.delete(p);
                    return trans(t,false);
                }
            );

            game.#kyc(player, game.#player);
            game.#kyc(peer, !game.#player);

            

            
            let calculate = (cards) => cards.flatMap(
                c => seed.map(
                    s => {
                        let r = new Map();
                        
                        r.set(
                            "f",
                            c.get("f")
                        );
                        
                        r.set(
                            "val",
                            c.get("f")(
                                s,
                                c.get("card")
                            )
                        );
                        
                        return r;
                    }
                )
            );
            let result = (calculated) => calculated.map(
                c => c.get("val")
            );

            player = calculate(player);
            
            peer = calculate(peer);

            let fscope = (calculated,other_results) => {
                let other_sgn = 1;
                let ds = 0;
                let os = 0;
                
                for(let c of calculated){
                    let val = c.get("val");
                    let f = c.get("f");
                    
                    if( (val % 10) === target ){
                        other_sgn = other_sgn * (-1);
                    }else if(f === game.#add){
                        let C = other_results.length;
                        let S = Math.round(
                            (
                                C - Math.sumPrecise(
                                    other_results.map( p => p % 2 )
                                )
                            ) / C * 60
                        );
                        let K = Math.abs((val - 20) - S);
                        
                        ds = ds + 10 * Math.round(
                            200 * (
                                Math.exp(-K/(2*Math.PI)) - Math.exp(-Math.PI)
                            )
                        );
                    }else if(f === game.#mul){
                        let x = val % (target + 1);

                        os = os + 10 * Math.round(
                            (10 + 10 * Math.sign(x)) * (
                                Math.exp(-x/(2*Math.PI)) 
                              - Math.sign(x) * Math.exp(-1/(2*Math.PI))
                            )
                        );
                    }else{
                        //pass
                    }
                }
                
                return [other_sgn,ds,os];
            };

            let [peer_sgn, player_ds,peer_C] = fscope(
                player,
                result(peer)
            );

            let [player_sgn,peer_ds,player_C] = fscope(
                peer,
                result(player)
            );

            game.#d_player = player_sgn * player_ds + player_C;
            game.#d_peer = peer_sgn * peer_ds + peer_C;
            
            game.#scope.set(
                game.#player,
                game.#scope.get(game.#player)
              + game.#d_player
            );
            
            game.#scope.set(
                !game.#player,
                game.#scope.get(!game.#player)
              + game.#d_peer
            );

            game.#next_seed();

            game.#update_scope();

            referee.count();
        }

        static vent(isplayer){
            if(isplayer === false){
                game.#event("peer says 'screw the rules'",false,true);
            }else{
                game.#event("player screaming at the umpire",true,false);
            }

            let f = [
                game.#mug,
                game.#steal,
                game.#demand,
                game.#discard,
                game.#retarget,
                game.#switch,
                game.#deal
            ];
            
            f[game.get_random(f.length)](
                game.#id(isplayer)
            );

            if(referee.attacked() === true){
                game.#referee_vent("pushed-to-the-edge referee");
            }else{
                //pass
            }
            
            if(isplayer=== true){
                peer.notice_take_action();
            }else{
                //pass
            }
            
        }
        
    }

    //peer by Claude
    //a peer with moods and hunches
    class peer{
        static #seeds = [];
        static #target = 0;
        static #my_scope = 0;
        static #it_scope = 0;
        static #my_last = null;
        static #card_counts = 16;
        static #min_scope = 0;
        static #max_scope = 0;
        static #flex_scope = 0;

        static #P_plus = 0.5;
        static #anger = 0;

        static notice_init(
            card_counts,
            min_scope,
            max_scope,
            flex_scope
        ){
            peer.#card_counts = card_counts;
            peer.#min_scope = min_scope;
            peer.#max_scope = max_scope;
            peer.#flex_scope = flex_scope;

            peer.#P_plus = 0.5;
            peer.#anger = 0;
            peer.#my_last = peer.#my_scope;
        }

        static notice_next_seed(seeds){
            peer.#seeds = seeds.map(
                s => Number.parseInt(s,10)
            );
            peer.#anger = peer.#anger * 0.8;
        }

        static notice_retarget(target){
            peer.#target = Number.parseInt(
                target,
                10
            );
        }

        static notice_scope_update(peer_scope,player_scope){
            peer.#my_scope = Number.parseInt(
                peer_scope,
                10
            );
            peer.#it_scope = Number.parseInt(
                player_scope,
                10
            );

            if(peer.#my_last === null){
                //pass
            }else{
                let move = peer.#my_scope - peer.#my_last;
                if(move > 300){
                    peer.#anger = Math.max(0,peer.#anger - 0.5);
                }else if(move < -300){
                    peer.#anger = peer.#anger + 0.3;
                }else{
                    //pass
                }
            }
            peer.#my_last = peer.#my_scope;
        }

        static watch_event(content){
            let match = content.match(/\[you\] (?<plus>\d+) \+card, (?<mul>\d+) \*card/u);
            if (match !== null){
                let { plus,mul } = match.groups;
                plus = Number.parseInt(plus,10);
                mul =  Number.parseInt(mul,10);
                if(plus + mul > 0){
                    peer.#P_plus = plus / (plus + mul);
                }else{
                    //pass
                }
            }else{
                //pass
            }

            let mood = [
                ["player screaming",0.6],
                ["chose violence",0.8],
                ["you: nice scope",1.2],
                ["master thief",0.5],
                ["turf war",0.5],
                ["uno reverse",0.3],
                ["Minimum spend unmet",2],
                ["Over-spending bonus",-1],
                ["dealing from the bottom",-0.5],
                ["forced purchase",0.4],
                ["Replay attack",0.4],
                ["auto-dump",0.6]
            ];
            for(let [word,delta] of mood){
                if(content.includes(word) === true){
                    peer.#anger = Math.max(0,peer.#anger + delta);
                }else{
                    //pass
                }
            }
        }

        static notice_take_action(){
            if(peer.#seeds.length === 0){
                return;
            }else{
                //pass
            }

            let hand = [...game.peer_select()];
            let index = hand.map( (c,i) => i );
            let own = hand.filter( c => c !== `` ).length;

            let target = (
                peer.#roll(1/12) === true
              ? game.get_random(10)
              : peer.#target
            );
            let E = Math.round(45 - 15 * peer.#P_plus);
            let feels = hand.map(
                c => (c === ``)
                   ? null
                   : peer.#feel(c,target,E) + (game.get_random(101) - 50) / 100
            );

            if(peer.#roll(peer.#heat(own,feels)) === true){
                peer.#anger = peer.#anger * 0.4;
                game.vent(false);
                return;
            }else{
                //pass
            }

            let tilt = Math.min(1,peer.#anger / 8);
            let picks = feels.map(
                f => {
                    if(f === null){
                        return false;
                    }else{
                        let p = Math.min(0.9,Math.max(0.1,0.15 + 0.28 * (f + 1)));
                        return peer.#roll(p * (1 - tilt) + 0.5 * tilt);
                    }
                }
            );

            let order = index.filter(
                i => hand[i] !== ``
            ).sort(
                (a,b) => feels[b] - feels[a]
            );
            let n = picks.filter( p => p === true ).length;
            if(n <= 4 && peer.#roll(0.8) === true){
                for(let i of order){
                    if(picks[i] === false && n < 5){
                        picks[i] = true;
                        n = n + 1;
                    }else{
                        //pass
                    }
                }
            }else if(n >= 12 && peer.#roll(0.7) === true){
                for(let i of [...order].reverse()){
                    if(picks[i] === true && n > 11){
                        picks[i] = false;
                        n = n - 1;
                    }else{
                        //pass
                    }
                }
            }else{
                //pass
            }

            let empties = hand.length - own;
            for(let i of index){
                if(hand[i] === ``){
                    let price = peer.#price(empties);
                    let fund = peer.#my_scope >= (
                        peer.#min_scope - peer.#flex_scope + price
                    );
                    if(peer.#roll(peer.#buy_p(price,n),fund) === true){
                        picks[i] = true;
                        empties = empties - 1;
                        n = n + 1;
                    }else{
                        //pass
                    }
                }else{
                    //pass
                }
            }

            let cards = game.peer_select();
            let select_it = false;
            let k = 0;
            for(
                let card = cards.next();
                card.done === false;
                card = cards.next(select_it)
            ){
                select_it = picks[k];
                k = k + 1;
            }
        }

        static #roll(p,base = true){
            return base && game.get_random(1000) < Math.round(p * 1000);
        }

        static #heat(own,feels){
            let heat = 0.15 + peer.#anger;

            let poor = own / peer.#card_counts;
            if(poor < 0.25){
                heat = heat + 2.5;
            }else if(poor < 0.5){
                heat = heat + 1;
            }else{
                //pass
            }

            let span = peer.#max_scope - peer.#min_scope;
            heat = heat + Math.min(
                3,
                Math.max(0,peer.#it_scope - peer.#my_scope) / (0.05 * span)
            );

            let best = feels.filter(
                f => f !== null
            ).sort(
                (a,b) => b - a
            ).slice(0,4);
            if(best.length > 0 && best.reduce( (a,b) => a + b ,0) / best.length < 0.3){
                heat = heat + 1;
            }else{
                //pass
            }

            return heat / (heat + 5);
        }

        static #feel(card,target,E){
            let N = Number.parseInt(card.slice(1),10);
            let sum = 0;
            for(let s of peer.#seeds){
                let r = (card[0] === "+") ? (s + N) : (s * N);
                if((r % 10) === target){
                    sum = sum + 0.5;
                }else if(card[0] === "+"){
                    let d = Math.abs((r - 20) - E);
                    if(d <= 8){
                        sum = sum + 2;
                    }else if(d <= 19){
                        sum = sum + 1;
                    }else{
                        sum = sum - 1;
                    }
                }else{
                    let x = r % (target + 1);
                    if(x === 0){
                        sum = sum + 2;
                    }else if(x === 1){
                        //pass
                    }else{
                        sum = sum - 1;
                    }
                }
            }
            return sum / peer.#seeds.length;
        }

        static #price(empty){
            if(empty <= 12){
                return 10 * empty;
            }else{
                return Math.round(2 * Math.exp(empty - 8));
            }
        }

        static #buy_p(price,n){
            let p = 0.08;
            if(price <= 200){
                p = 0.75;
            }else if(price <= 1000){
                p = 0.35;
            }else{
                //pass
            }

            p = p + Math.min(0.2,peer.#anger / 20);
            if(n < 5){
                p = p + 0.15;
            }else if(n >= 11){
                p = p * 0.2;
            }else{
                //pass
            }
            return Math.min(0.95,p);
        }
    }
    
    class referee{
        static #history = new Map();
        static #be_vent = 0;
        static #mem_count = 0;
        
        static{
            referee.#history.set(
                true,
                new Map(
                    [
                        ["+",0],
                        ["*",0]
                    ]
                )
            );
            referee.#history.set(
                false,
                new Map(
                    [
                        ["+",0],
                        ["*",0]
                    ]
                )
            );
        }

        static count(){
            referee.#mem_count = referee.#mem_count + 1;
            let P = (x) => Math.floor(300 / (Math.PI * (1 + Math.exp(10 - x/2)))); 
            // max(P(x)) = 95
            if(
                game.get_random(100) < P(referee.#mem_count)
            ){
                referee.#mem_count = game.AI_hallucination(
                    referee.#mem_count
                );
            }else{
                //pass
            }
        }
        
        static remember(tp,is_player){
            let T = referee.#history.get(
                is_player
            );
            
            T.set(
                tp,
                T.get(tp) + 1
            );
        }

        static publish(is_player){
            let T = referee.#history.get(
                is_player
            );
            
            return `${T.get("+")} +card, ${T.get("*")} *card`;
        }

        static attacked(){
            referee.#be_vent = referee.#be_vent + 1;
            if(
                game.get_random(10) < referee.#be_vent
            ){
                referee.#be_vent = 0;
                return true;
            }else{
                return false;
            }
        }
    }
    
</script>
