<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,height=device-height,
                                   initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,
                                   user-scalable=no"/>
</head>
<script>
    class game{

        static #player = true;
        
        static #scope = new Map();

        static #peer_selected = new Set();

        /*NOTE: those requires unchecked*/
        
        // min_scope % 10 === 0
        static #min_scope = 0;
        // max_scope % 10 === 0
        // && max_scope >= min_scope + 200
        static #max_scope = 32000;
        // flex_scope >= 0 && flex_scope % 10 === 0
        static #flex_scope = 1000;
        //    min_scope <= init_scope
        // && init_scope <= max_scope
        // && init_scope % 10 === 0
        static #init_scope = 2000;
        // max chars of N, where
        //    (min_scope - flex_scope) <= N
        // && N <= (max_scope + flex_scope)
        static #scope_fix = 5;

        //display duration, in ms
        static #each_event_display = 3000;
        
        static #event_promise = Promise.resolve();

        static #id(isplayer){
            return (
                (isplayer === true) 
                ?  (game.#player) 
                :  (!game.#player)
            );
        }

        static #name(id){
            return (
                (id === game.#player)
                ? "you"
                : "peer"
            );
        }

        static #event(content,peer_watch = true,player_watch = true){
            let e = document.getElementById("event");

            game.#event_promise = game.#event_promise.then(
                () => {
                    if(peer_watch === true){
                        peer.watch_event(content);
                    }else{
                        //pass
                    }
                    
                    if(player_watch === true){
                        e.textContent = content;
                        e.style.visibility = "visible";
                        return new Promise(
                            (resolve,reject) => setTimeout(
                                resolve,
                                game.#each_event_display
                            )
                        );
                    }else{
                        return;
                    }
                }
            ).then(
                () => {
                    e.style.visibility = "hidden";
                }
            );       
        }

        static #switch(_ = null){
            game.#event("uno reverse!");
            
            game.#player = !game.#player;
            let card = document.getElementsByClassName("card"); 
            for(let c of card){
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                   //pass 
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
            game.#update_scope();
        }
        
        static #steal(_ = null){
            game.#event("a master thief strikes");
            
            let card = document.getElementsByClassName("card");
            let thf = (c) => (game.get_random(2) === 0)? c : ``;
            for(let c of card){
                c.dataset[game.#player] = thf(c.dataset[game.#player]);
                c.dataset[!game.#player] = thf(c.dataset[!game.#player]);
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                   //pass 
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
        }

        static #mug(_ = null){
            game.#event("black-market turf war");
            
            let card = document.getElementsByClassName("card");
            let rdi = () => game.get_random(card.length);
            let rnd = () => game.get_random(2) === 0;
            
            let res = (c) => {
                c.textContent = c.dataset[game.#player];
                
                if(c.dataset[game.#player] === ``){
                    c.className = `card`;
                }else{
                    //pass
                }
                
                if(c.dataset[!game.#player] === ``){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            };
            
            let fmug = (a,b) => {
                let A = card[rdi()];
                let B = card[rdi()];
                A.dataset[a] = B.dataset[b];
                B.dataset[b] = ``;
                res(A);
                res(B);
            };
            
            do {
                if( rnd() === true ){
                    fmug(
                        game.#player,
                        !game.#player
                    );
                }else{
                    fmug(
                        !game.#player,
                        game.#player
                    );
                }  
            } while (rnd() === true);
        }
        
        static #demand(id){
            game.#event(`${game.#name(id)}: nice scope you got there...`);
                
            game.#scope.set(
                id,
                game.#scope.get(id) + 200
            );
            game.#scope.set(
                !id,
                game.#scope.get(!id) - 200
            );
            game.#update_scope();
        }
        
        static #discard(id){
            game.#event(`${game.#name(id)}: generous donation`);
            
            game.#scope.set(
                id,
                game.#scope.get(id) - 200
            );
            game.#scope.set(
                !id,
                game.#scope.get(!id) + 200
            );
            game.#update_scope();
        }

        static #retarget(_ = null, notice = true){
            if(notice === true){
                game.#event("moving the goalposts");
            }else{
                //pass
            }
            
            let target = document.getElementById("target");
            target.textContent = String(
                game.get_random(9)
            ).padStart(1,"0");
            peer.notice_retarget(target.textContent);
        }
        
        static #rescope(_ = null){
            game.#event("inflation strikes");

            let f = () => (game.#min_scope + 100) + game.get_random(
                (game.#max_scope - game.#min_scope) / 10 - 19
            ) * 10;
            game.#scope.set(game.#player, f());
            game.#scope.set(!game.#player, f());
            game.#update_scope();
        }

        static #deal(_ = null, notice = true){
            if(notice === true){
                game.#event("dealing from the bottom");
            }else{
                //pass
            }
            
            let card = document.getElementsByClassName("card");
            for(let c of card){
                c.dataset[game.#player] = game.#new_card_content();
                c.dataset[!game.#player] = game.#new_card_content();
                c.textContent = c.dataset[game.#player];
                c.className = `card`;
                game.#peer_selected.delete(c);
            }
        }

        static #add(seed,card){
            return seed + card;
        }

        static #mul(seed,card){
            return seed * card;
        }
        
        static #next_seed(){
            let seed = document.getElementsByClassName("seed");
            for(let s of seed){
                s.textContent = game.#new_seed_content(10,1);
            }
            peer.notice_next_seed(
                [...seed].map(s => s.textContent)
            );
        }
        
        static #update_scope(){
            let scope = document.getElementById("scope");
            let values = [...game.#scope.values()];
            if(values.find(
                e => 
                    e < (game.#min_scope - game.#flex_scope) 
                ||  e > (game.#max_scope + game.#flex_scope)
            ) !== undefined){
                //rule violation
                dialog.notice("Rule Violation!").then(
                    () => {
                        game.init(false);
                        game.#steal();
                    }
                );
            }else if(
                game.#scope.get(game.#player) >= game.#max_scope
             && game.#scope.get(!game.#player) >= game.#max_scope
            ){
                //both draw
                dialog.notice("-_Draw_-").then(
                    () => game.init(false)
                );
            }else if(game.#scope.get(game.#player) >= game.#max_scope){
                //player win
                dialog.notice("^_Win_^").then(
                    () => game.init(false)
                );
            }else if(game.#scope.get(!game.#player) >= game.#max_scope){
                //peer win
                dialog.notice("T_Fail_T").then(
                    () => game.init(false)
                );
            }else{
                let fscope = (t) => String(
                    game.#scope.get(t)
                ).padStart(game.#scope_fix," ");
                let player_scope = fscope(game.#player);
                let peer_scope = fscope(!game.#player);
                
                scope.textContent = `P ${peer_scope}\nY ${player_scope}`;
                peer.notice_scope_update(
                    peer_scope,
                    player_scope
                );
            }
        }

        static #new_seed_content(sup, max_digits){
            return String(
                game.get_random(sup)
            ).padStart(max_digits,"0");
        }

        static #new_card_content(){
            let op = "+*";
            let random_op = op[game.get_random(op.length)];
            
            return `${random_op}${game.#new_seed_content(100,2)}`;
        }

        static #new_card(self,isplayer){
            let content = game.#new_card_content();
            let id = game.#id(isplayer);
            
            let card = document.getElementsByClassName("card");
            let empty = 0;
            for(let c of card){
                empty = empty + (
                    c.dataset[id] === ``
                  ? 1
                  : 0
                );
            }
            
            if(self.dataset[id] === ``){
                
                let P = (
                    game.get_random(3) < 2
                  ? 1
                  : 0
                );
                game.#scope.set(
                    id,
                    game.#scope.get(id) 
                  - 10 * empty * P
                );
                
                self.dataset[id] = content;
            }else{
                //pass
            }
            self.textContent = self.dataset[game.#player];

            game.#update_scope();

        }

        static #referee_vent(){
            game.#event("the referee chose violence");
            
            let f = [
                game.#steal,
                game.#rescope,
                game.#retarget,
                game.#switch
            ];
            
            f[game.get_random(f.length)]();
        }

        static get_random(sup){
            let next = new Uint32Array(1);
            next[0] = ~0;
            next[0] = Math.floor(next[0] * Math.random());
            window.crypto?.getRandomValues(next);
            return next[0] % sup;
        }

        static init(is_load = true){
            game.#scope.set(
                game.#player,
                game.#init_scope
            );
            game.#scope.set(
                !game.#player,
                game.#init_scope
            );
            game.#update_scope();
            
            game.#next_seed();
            
            game.#deal(null,false);
            
            game.#retarget(null,false);

            let card = document.getElementsByClassName("card");
            peer.notice_init(
                card.length,
                game.#min_scope,
                game.#max_scope,
                game.#flex_scope
            );

            if(is_load === false){
                return;
            }else{
                dialog.notice(
`\
seed: the blue line,
      0 <= seed and
      seed <= 9
card: all under seed,
      click to selected (green),
      or not (gray).
      if a used card is click
      to selected, auto new card
      and 2/3 probability will
      (scope - 10 * U),
      where U is count of used card,
      before get this new card.
      number on card text is:
      0 <= number and
      number <= 99
*card: card text content
       start with *
+card: card text content
       start with +
target: on the left of PLAY,
        0 <= target and
        target < 9
------
PLAY: click to play a card,
      all selected cards will be
      calculated with all seed,
      in this form: (seed card),
      as results, 
      forall result belongs to  results,
      
      if (result mod 9) = target :
         (scope + 100)
      else if card is +card:
         let S = sum(
            ((peer results) mod result)
            mod 2
         )
         let C = round(count(peer results)/2)
         if  S > C:
            (scope + 30)
         else if S = C:
            (scope + 80)
         else if S < C:
            (scope - 30)
       else if card is *card:
          let M = max(peer results)
          let m = min(peer results)
          if results >= M + m:
             (scope - 30)
          else if result >= M:
             (scope + 60)
          else:
             (scope + 30)
     
      all selected cards marked used
      by remove text content.
      NOTE: if player or peer no selected
      card, referee will be vent,
      and attack you and peer
VENT: click to vent, 
      then attack a referee.
      NOTE: peer also can do.
------
scope: 
      if anyone scope < ${game.#min_scope - game.#flex_scope} 
      or scope > ${game.#max_scope + game.#flex_scope}:
        Rule Violation
      else if both >= ${game.#max_scope}
        Draw
      else if only your >= ${game.#max_scope}:
        (you) Win
      else if only peer >= ${game.#max_scope}:
        (peer) Win, aka (You) Fail
      NOTE： Y = you, P = peer
------
attack a referee will 
cause one of following:
   mug:  you and peer are muggings each other,
         at least one times.
         if you succeed, you discard your card
         and get peer card, includes used.
   steal: random marked used card,
          for you and peer
   demand: (scope + 200) for you,
           (scope - 200) for peer,
   discard: (scope - 200) for you,
            (scope + 200) for peer
   retarget: random new target
   switch: swap you and peer
   deal: you and peer will get 
         whole new cards
attack you and peer will
cause one of following:
   steal: random marked used card,
          for you and peer
   rescope: random scope,
            ${(game.#min_scope + 100) + (0) * 10} <= scope and 
            scope <= ${
                (game.#min_scope + 100) + (
                    (game.#max_scope - game.#min_scope) / 10 - 20
                ) * 10
            },
            for you and peer
   retarget: random new target
   switch: swap you and peer
`
                );
            }
        }
        
        static player_select(self){
            if(self.className === `card`){
                game.#new_card(self,true);
                self.className = `card selected`;
            }else{
                self.className = `card`;
            }

            peer.notice_take_action();
        }

        static *peer_select(){
            let card = document.getElementsByClassName("card");

            for(let c of card){
                let is_select = (yield c.dataset[!game.#player]);
                if( is_select === true){
                    game.#new_card(c,false);
                    game.#peer_selected.add(c);
                }else if( is_select === false){
                    game.#peer_selected.delete(c);
                }else{
                    //pass
                }
            }
        }

        static play(){
            let seed = document.getElementsByClassName("seed");
            let target = document.getElementById("target");
            let player = document.getElementsByClassName("selected");
            let peer = game.#peer_selected;

            if(player.length === 0 || peer.size === 0){
                game.#referee_vent();
                return;
            }else{
                //pass
            }

            let error = () => {
                dialog.notice("Data Tampering!!!").then(
                    () => location.reload()
                );
            };
            let int = (s, sup) => {
                let n = Number.parseInt(s,10);
                if(Number.isNaN(n) === true || n < 0 || n >= sup){
                    error();
                }else{
                    return n;
                }
            };
            let trans = (t) => {
                let r = new Map();
                if( t[0] === "+"){
                    r.set("f",game.#add);
                } else if ( t[0] === "*" ){
                    r.set("f",game.#mul);
                } else{
                    error();
                }
                r.set(
                    "card", 
                    int(t.slice(1),100)
                );
                return r;
            };
            
            seed = [...seed].map(
                s => int(s.textContent,10)
            );
            target = int(target.textContent,9);
            
            player = [...player].map(
                p => {
                    let t = p.dataset[game.#player];
                    p.dataset[game.#player] = "";
                    p.textContent = p.dataset[game.#player];
                    p.className = `card`;
                    return trans(t);
                }
            );
            peer = [...peer].map(
                p => {
                    let t = p.dataset[!game.#player];
                    p.dataset[!game.#player] = "";
                    game.#peer_selected.delete(p);
                    return trans(t);
                }
            );
            
            let calculate = (cards) => cards.flatMap(
                c => seed.map(
                    s => {
                        let r = new Map();
                        
                        r.set(
                            "f",
                            c.get("f")
                        );
                        
                        r.set(
                            "val",
                            c.get("f")(
                                s,
                                c.get("card")
                            )
                        );
                        
                        return r;
                    }
                )
            );
            let result = (calculated) => calculated.map(
                c => c.get("val")
            );

            player = calculate(player);
            let player_min = Math.min(...result(player));
            let player_max = Math.max(...result(player));
            
            peer = calculate(peer);
            let peer_min = Math.min(...result(peer));
            let peer_max = Math.max(...result(peer));

            let fscope = (calculated,id,other,min,max) => {
                for(let c of calculated){
                    let val = c.get("val");
                    let f = c.get("f");
                    let ds = 0;
                    
                    if( (val % 9) === target ){
                        ds = 100;
                    }else if(f === game.#add){
                        let S = Math.sumPrecise(
                            result(other).map(
                                p => (p % val) % 2
                            )
                        );
                        let C = Math.round(result(other).length / 2);
                        
                        if( S > C){
                            ds = 30;
                        }else if ( S === C){
                            ds = 80;
                        }else if( S < C){
                            ds = - 30;
                        }else{
                            //pass
                        }
                    }else if(f === game.#mul){
                        if(val >= max + min){
                            ds = -30;
                        }else if(val >= max){
                            ds = 60;
                        }else{
                            ds = 30;
                        }
                    }else{
                        //pass
                    }
                    
                    game.#scope.set(
                        id,
                        game.#scope.get(id) + ds
                    );
                }
            };

            fscope(
                player,
                game.#player,
                peer,
                peer_min,
                peer_max
            );

            fscope(
                peer,
                !game.#player,
                player,
                player_min,
                player_max
            );

            game.#next_seed();

            game.#update_scope();
        }

        static vent(isplayer){
            if(isplayer === false){
                game.#event("peer says 'screw the rules'",false,true);
            }else{
                game.#event("player screaming at the umpire",true,false);
            }

            let f = [
                game.#mug,
                game.#steal,
                game.#demand,
                game.#discard,
                game.#retarget,
                game.#switch,
                game.#deal
            ];
            
            f[game.get_random(f.length)](
                game.#id(isplayer)
            );
            
            peer.notice_take_action();
        }
        
    }

    //a simple peer
    class peer{
        static #seeds;
        static #target;
        static #my_scope;
        static #it_scope;
        static #card_counts;
        static #min_scope;
        static #max_scope;
        static #flex_scope;
        
        static notice_init(
            card_counts,
            min_scope,
            max_scope,
            flex_scope
        ){
            peer.#card_counts = card_counts;
            peer.#min_scope = min_scope;
            peer.#max_scope = max_scope;
            peer.#flex_scope = flex_scope;
        }
        
        static notice_next_seed(seeds){
            peer.#seeds = seeds.map(
                s => Number.parseInt(s,10)
            );
        }
        
        static notice_retarget(target){
            peer.#target = Number.parseInt(
                target,
                10
            );
        }

        static notice_scope_update(peer_scope,player_scope){
            peer.#my_scope = Number.parseInt(
                peer_scope,
                10
            );
            peer.#it_scope = Number.parseInt(
                player_scope,
                10
            );
        }

        static watch_event(content){
            //this method is empty
            //maybe for moods of peer
            //influence desition

            
        }

        static notice_take_action(){
            let empty_counts = peer.#empty_counts();
            let min = (200 + peer.#min_scope);
            let sup = (peer.#max_scope - 800);
            if(
                peer.#deside(
                    [peer.#my_scope,peer.#it_scope].every(
                        s => s >= min 
                          && s < sup
                    ),
                    Math.max(
                        0,
                        peer.#it_scope - peer.#my_scope
                    ),
                    sup - min
                ) === true ||
                peer.#deside(
                    2 * empty_counts > peer.#card_counts,
                    empty_counts,
                    peer.#card_counts
                ) === true
            ){
                game.vent(false);
            }else{
                let cards = game.peer_select();
                let select_it = false;
                for(
                    let card = cards.next();
                    card.done === false;
                    card = cards.next(select_it)
                ){
                    if(card.value === ``){
                        select_it = peer.#deside(
                            peer.#my_scope >= (
                                peer.#min_scope - peer.#flex_scope + (10 * empty_counts)
                            ),
                            2 * peer.#card_counts - empty_counts,
                            2 * peer.#card_counts + 1
                        );
                        empty_counts = empty_counts - (
                            (select_it === true)? 1 : 0
                        );
                    }else if(card.value[0] === "+"){
                        select_it = peer.#add_card(
                            Number.parseInt(
                                card.value.slice(1),
                                10
                            )
                        );
                    }else if(card.value[0] === "*"){
                        select_it = peer.#mul_card(
                            Number.parseInt(
                                card.value.slice(1),
                                10
                            )
                        );
                    }else{
                        select_it = false;
                    }
                }
            }
        }


        static #deside(base,p,q){
            return base && game.get_random(q) < p;
        }

        static #empty_counts(){
            let counts = 0;
            for(let c of game.peer_select()){
                counts = counts + (
                    c === `` ? 1 : 0
                );
            }
            return counts;
        }

        static #add_card(card){
            let result = peer.#seeds.map( s => s + card);
            let S = peer.#seeds.length;
            let s = 0;
            for(let r of result){ 
                if((r % 9) === peer.#target){
                    return true;
                }else if(r <= 20){
                    s = s + 1;
                }else{
                    s = s + (r % 2);
                }
            }

            return peer.#deside(
                true,
                s,
                S
            );
        }

        static #mul_card(card){
            let result = peer.#seeds.map( s => s * card );
            let S = peer.#seeds.length;
            let s = 0;
            let vote = (p,q) => (
                 peer.#deside(true,p,q)
               ? 1
               : 0
            );
            for(let r of result){
                if((r % 9) === peer.#target){
                    return true;
                }else if(r >= 50 * 9){
                    s = s + vote(2,3);
                }else{
                    s = s + vote(1,2);
                }
            }
            
            return peer.#deside(
                true,
                s,
                S
            );
        }
        
    }
</script>
<script src="https://lang-core.org/dialog.js"></script>
<style>
    body{
        margin: 0;
        padding: 0;
    }

    .seeds,.cards,.screen{
        position: fixed;
        display: grid;
        gap: 10px;
        background-color: salmon;
    }

    .seed,.card,#scope,#target,.vent,.play,#event{
        display: flex;
        align-items: center;
        justify-content: center;
        color: plum;
        font-size: 3rem;
        font-weight: bolder;
        font-family: monospace;
        text-align: center;
        user-select:none;
        white-space: pre-wrap;
        overflow: auto;
    }
    
    .cards{
        top: 40dvh;
        left:0;
        width:100dvw;
        height:60dvh;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4,1fr);
        
    }
    .card{
        background-color: lightgray;
        
    }
    .selected{
